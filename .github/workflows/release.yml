name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test ./...
      - name: Check the tag matches internal/version/VERSION
        run: |
          version=$(cat internal/version/VERSION)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION ${version}"
            exit 1
          fi
      - name: Build and sign release archives
        env:
          TAPER_SIGNING_KEY: ${{ secrets.TAPER_SIGNING_KEY }}
        run: |
          if [ -z "$TAPER_SIGNING_KEY" ]; then
            echo "::error::The TAPER_SIGNING_KEY secret isn't set, so the release can't be signed"
            exit 1
          fi
          make dist
          for f in dist/*.tar.gz; do
            tar -tzf "$f" | grep -q '/MANIFEST.sig$' || { echo "::error::$f isn't signed"; exit 1; }
          done
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --title "Taper ${GITHUB_REF_NAME}" --notes-file notes.md "${flags[@]}"
