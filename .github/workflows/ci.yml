name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build release archives
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Installs the built release on a real systemd machine, upgrades it in
  # place, and removes it again.
  install:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install, upgrade and uninstall
        run: sudo scripts/ci-install-test.sh dist

  # Updates from the web interface on a real systemd machine: install,
  # update, roll back by hand, and an update that doesn't start.
  update:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Update, roll back, and recover from a broken update
        run: scripts/ci-update-test.sh
