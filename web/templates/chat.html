{{define "content"}}
<div class="page-head row-head">
  <div><h1>Chat</h1><p class="muted">News for everyone at {{.School}}, your classes' chats and your group chats.</p></div>
  {{if .User.IsLeader}}<a class="button primary" href="/chat/new">New group chat</a>{{end}}
</div>
<section class="card chat-list-card">
  {{if .D.Channels}}{{template "chat-channels" .D.Channels}}
  {{else}}<p class="muted">Chat is turned off at your school.</p>{{end}}
</section>
{{end}}
