{{define "content"}}
<section class="auth-card card">
  <h1>Choose a new password</h1>
  <p class="muted">You signed in with a temporary password. Choose your own to continue.</p>
  {{with .D.Error}}<div class="flash flash-error" role="alert">{{.}}</div>{{end}}
  <form method="post" action="/password" class="form">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="text" name="username" value="{{.User.Username}}" autocomplete="username" hidden>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" autofocus aria-describedby="pw-help">
    <p id="pw-help" class="help">At least 8 characters. A short sentence is easy to remember and hard to guess.</p>
    <label for="confirm">Type it again</label>
    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
    <button type="submit" class="button primary block">Save and continue</button>
  </form>
  <form method="post" action="/logout" class="center">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button type="submit" class="link-button">Sign out instead</button>
  </form>
</section>
{{end}}
